<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站粉丝追踪</title>
  <link rel="icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-fill: rgba(88,166,255,0.08);
      --positive: #3fb950;
      --negative: #f85149;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #ffffff;
        --card-bg: #f6f8fa;
        --text-main: #24292f;
        --text-dim: #57606a;
        --border: #d0d7de;
        --accent: #0969da;
        --accent-fill: rgba(9,105,218,0.08);
        --positive: #1a7f37;
        --negative: #cf222e;
      }
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-color);color:var(--text-main);min-height:100vh}
    .container{max-width:960px;margin:0 auto;padding:32px 16px}
    .card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:24px;display:flex;align-items:center;gap:20px}
    .face{width:80px;height:80px;border-radius:50%}
    .info h1{font-size:24px;color:var(--text-main)}
    .info h1 a{color:inherit;text-decoration:none}
    .info h1 a:hover{color:var(--accent);text-decoration:underline}
    .info p{color:var(--text-dim);margin-top:4px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
    .stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
    .stat-box .value{font-size:22px;font-weight:700;color:var(--text-main)}
    .stat-box .value.positive{color:var(--positive)}
    .stat-box .value.negative{color:var(--negative)}
    .stat-box .label{font-size:12px;color:var(--text-dim);margin-top:4px}
    .chart-wrap{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:24px}
    .navigator{height:120px;margin:-2px 18px 16px;padding:28px 0 22px;border-top:1px solid var(--border);position:relative}
    .navigator-chart{height:66px;position:relative}
    .navigator-handle{position:absolute;width:34px;height:7px;padding:0;border:0;border-radius:99px;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:grab;transform:translateX(-50%);touch-action:none}
    .navigator-handle:active{cursor:grabbing}
    .navigator-handle:focus-visible{outline:2px solid var(--text-main);outline-offset:2px}
    .navigator-window-date,.navigator-boundary-date{position:absolute;color:var(--text-dim);font-size:11px;line-height:1;white-space:nowrap;pointer-events:none}
    .navigator-full-days{position:absolute;color:var(--accent);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;pointer-events:none;transform:translateX(-50%)}
    .navigator-window-start{transform:translateX(calc(-100% - 20px))}
    .navigator-window-end{transform:translateX(20px)}
    .navigator-boundary-start{left:0;bottom:4px}
    .navigator-boundary-end{right:0;bottom:4px}
    .main-chart{height:400px;position:relative}
    .time-range{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .time-range button{height:30px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-dim);cursor:pointer}
    .time-range button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .custom-days{height:30px;display:flex;align-items:center;gap:4px;padding:0 8px;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:13px}
    .custom-days input{width:34px;padding:0;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;color:var(--text-main);font:inherit;text-align:center;outline:none}
    .custom-days input:focus{border-bottom-color:var(--accent)}
    .custom-days.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .custom-days.active input{color:#fff;border-bottom-color:rgba(255,255,255,.75)}
    .video-toggle{display:flex;align-items:center;gap:6px;margin-left:auto;padding:6px 0;color:var(--text-dim);font-size:13px;cursor:pointer;user-select:none}
    .video-toggle input{accent-color:var(--accent)}
    .video-markers{position:absolute;inset:0;z-index:2;pointer-events:none}
    .video-marker-label,.video-marker-hit{position:absolute;pointer-events:auto}
    .video-marker-label{width:148px;height:28px;padding:0;border:1px solid var(--accent);border-radius:6px;background:var(--card-bg);color:var(--text-main);font-size:12px;box-shadow:0 2px 7px rgba(0,0,0,.2);cursor:pointer}
    .video-marker-title{display:block;height:26px;padding:0 9px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
    .video-marker-hit{width:18px;height:18px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}
    .video-marker-label,.video-marker-hit{text-decoration:none}
    .video-marker-label:hover,.video-marker-label:focus,.video-marker-hit:hover,.video-marker-hit:focus{z-index:1000 !important}
    .video-marker-label:focus-visible,.video-marker-hit:focus-visible{outline:2px solid var(--text-main);outline-offset:2px}
    .video-detail{position:absolute;top:calc(100% + 8px);left:50%;display:flex;gap:9px;width:280px;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-main);box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translate(-50%,-4px);transition:opacity .14s ease,transform .14s ease;pointer-events:none;text-align:left;z-index:3}
    .video-marker-label:hover .video-detail,.video-marker-label:focus .video-detail,.video-marker-hit:hover .video-detail,.video-marker-hit:focus .video-detail{opacity:1;visibility:visible;transform:translate(-50%,0)}
    .video-detail-cover{width:96px;height:54px;flex:none;position:relative}
    .video-detail-cover img{width:100%;height:100%;display:block;object-fit:cover;border-radius:4px;background:var(--border)}
    .video-duration{position:absolute;right:3px;bottom:3px;padding:1px 4px;border-radius:2px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;line-height:1.25}
    .video-detail-copy{min-width:0}
    .video-detail-title{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .video-detail-meta{margin-top:5px;color:var(--text-dim);font-size:12px;line-height:1.4;text-align:right}
    .input-box{text-align:center;padding:100px 20px}
    .query-form{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:24px}
    .query-form input{height:36px;width:200px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-color);color:var(--text-main);line-height:36px}
    .query-form button{height:36px;width:80px;padding:0 20px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;line-height:36px}
  </style>
</head>
<body>
  <div class="container" id="app"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const app = document.getElementById('app');

    if (!uid) {
      app.innerHTML = `<div class="input-box">
        <h1>追踪B站UP主粉丝数</h1>
        <div class="query-form">
          <input type="text" id="uidInput" placeholder="请输入 uid">
          <button onclick="window.location.href='?uid=' + document.getElementById('uidInput').value">查看</button>
        </div>
      </div>`;
    } else {
      fetchData();
    }

    async function fetchData() {
      try {
        const res = await fetch(`./data/${encodeURIComponent(uid)}.json`, { cache: 'no-store' });
        if (!res.ok) {
          renderError(res.status === 404 ? '没有这个UP主的数据' : '数据加载失败');
          return;
        }
        const { meta, records, videos = [] } = await res.json();
        if (!meta || !Array.isArray(records)) {
          renderError('数据格式错误');
          return;
        }
        if (records.length === 0) {
          renderError('暂无粉丝记录');
          return;
        }
        render(meta, records, videos);
      } catch (e) {
        renderError('数据加载失败');
      }
    }

    function renderError(message) {
      app.innerHTML = '<div class="input-box"><h1 id="errorTitle"></h1></div>';
      document.getElementById('errorTitle').textContent = message;
    }

    let chart = null;
    let overviewChart = null;
    function render(meta, records, videos) {
      const latest = records[records.length - 1];
      const todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);
      const recordsBeforeToday = records.filter(r => new Date(r.time) < todayStart);
      const recordsToday = records.filter(r => new Date(r.time) >= todayStart);
      const todayBase = recordsBeforeToday[recordsBeforeToday.length - 1] || recordsToday[0];
      const todayChange = todayBase ? latest.fans - todayBase.fans : 0;
      const todayChangeText = `${todayChange >= 0 ? '+' : ''}${todayChange.toLocaleString()}`;
      const todayChangeClass = todayChange > 0 ? 'positive' : todayChange < 0 ? 'negative' : '';

      app.innerHTML = `
        <div class="card">
          <img src="${meta.face}" class="face" referrerpolicy="no-referrer">
          <div class="info">
            <h1><a href="https://space.bilibili.com/${uid}" target="_blank" rel="noopener noreferrer">${meta.name}</a></h1>
            <p>${meta.sign || '暂无签名'}</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat-box"><div class="value">${latest.fans.toLocaleString()}</div><div class="label">当前粉丝</div></div>
          <div class="stat-box"><div class="value ${todayChangeClass}">${todayChangeText}</div><div class="label">今日变化</div></div>
          <div class="stat-box"><div class="value">${meta.like_num.toLocaleString()}</div><div class="label">获赞数</div></div>
          <div class="stat-box"><div class="value">${meta.archive_count}</div><div class="label">稿件数</div></div>
        </div>
        <div class="chart-wrap">
          <div class="time-range" id="timeRange">
            <button data-days="1">1天</button>
            <button data-days="7" class="active">7天</button>
            <button data-days="30">30天</button>
            <button data-days="90">90天</button>
            <button data-days="365">365天</button>
            <label class="custom-days" id="customDaysControl">自定义 <input id="customDays" type="number" min="1" step="1" value="3" aria-label="自定义天数"> 天</label>
            <button data-days="0">全部</button>
            <label class="video-toggle"><input type="checkbox" id="videoToggle"> 视频投稿</label>
          </div>
          <div class="navigator">
            <div class="navigator-chart"><canvas id="overviewChart"></canvas></div>
            <button class="navigator-handle" id="navigatorHandle" type="button" aria-label="拖动查看时间范围"></button>
            <span class="navigator-full-days" id="navigatorFullDays" hidden></span>
            <span class="navigator-window-date navigator-window-start" id="windowStartDate"></span>
            <span class="navigator-window-date navigator-window-end" id="windowEndDate"></span>
            <span class="navigator-boundary-date navigator-boundary-start" id="fullStartDate"></span>
            <span class="navigator-boundary-date navigator-boundary-end" id="fullEndDate"></span>
          </div>
          <div class="main-chart">
            <canvas id="chart"></canvas>
            <div class="video-markers" id="videoMarkers"></div>
          </div>
        </div>
      `;
      
      let selectedPoints = [];
      let showVideoPosts = false;
      const markerLayer = document.getElementById('videoMarkers');
      const navigatorHandle = document.getElementById('navigatorHandle');
      const navigatorFullDays = document.getElementById('navigatorFullDays');
      const customDaysInput = document.getElementById('customDays');
      const customDaysControl = document.getElementById('customDaysControl');
      const windowStartDate = document.getElementById('windowStartDate');
      const windowEndDate = document.getElementById('windowEndDate');
      const fullStartDate = document.getElementById('fullStartDate');
      const fullEndDate = document.getElementById('fullEndDate');
      const rangeButtons = [...document.querySelectorAll('#timeRange button')];
      const preferenceKey = 'bili-fans-tracker:chart-preferences';
      let selectedDays = 7;
      try {
        const saved = JSON.parse(localStorage.getItem(preferenceKey) || '{}');
        const savedDays = Number(saved.selectedDays);
        const savedCustomDays = Math.floor(Number(saved.customDays));
        if (Number.isFinite(savedDays) && savedDays >= 0) selectedDays = savedDays;
        if (Number.isFinite(savedCustomDays) && savedCustomDays >= 1) customDaysInput.value = String(savedCustomDays);
        showVideoPosts = saved.showVideoPosts === true;
      } catch {
        // Use the default controls when storage is unavailable or malformed.
      }
      document.getElementById('videoToggle').checked = showVideoPosts;
      const fullStartTime = new Date(records[0].time).getTime();
      const fullEndTime = new Date(records[records.length - 1].time).getTime();
      const fullSpan = Math.max(0, fullEndTime - fullStartTime);
      const fullDays = Math.max(1, Math.ceil(fullSpan / 86400000));
      let rangeStart = Math.max(fullStartTime, fullEndTime - selectedDays * 86400000);

      const savePreferences = () => {
        try {
          localStorage.setItem(preferenceKey, JSON.stringify({
            selectedDays,
            customDays: Math.floor(Number(customDaysInput.value)) || 3,
            showVideoPosts
          }));
        } catch {
          // The chart remains fully usable when storage is unavailable.
        }
      };

      const formatNavigatorDate = (time, includeYear) => {
        const date = new Date(time);
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return includeYear ? `${date.getFullYear()}-${month}-${day}` : `${month}-${day}`;
      };
      fullStartDate.textContent = formatNavigatorDate(fullStartTime, true);
      fullEndDate.textContent = formatNavigatorDate(fullEndTime, true);

      const getActiveRange = () => {
        const duration = selectedDays === 0 ? fullSpan : Math.min(fullSpan, selectedDays * 86400000);
        const maxStart = fullEndTime - duration;
        rangeStart = Math.min(Math.max(rangeStart, fullStartTime), maxStart);
        return { start: rangeStart, end: rangeStart + duration, maxStart };
      };

      const setSelectedDays = days => {
        selectedDays = days;
        const duration = days === 0 ? fullSpan : Math.min(fullSpan, days * 86400000);
        rangeStart = fullEndTime - duration;
      };

      const syncRangeControl = () => {
        rangeButtons.forEach(button => button.classList.remove('active'));
        const matchedButton = rangeButtons.find(button => Number(button.dataset.days) === selectedDays);
        if (matchedButton) {
          matchedButton.classList.add('active');
          customDaysControl.classList.remove('active');
        } else {
          customDaysControl.classList.add('active');
        }
      };
      syncRangeControl();

      const formatVideoDuration = seconds => {
        const total = Number(seconds);
        if (!Number.isFinite(total)) return '时长未知';
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = total % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
          : `${minutes}:${String(secs).padStart(2, '0')}`;
      };

      const formatVideoDate = seconds => {
        const date = new Date(Number(seconds) * 1000);
        if (Number.isNaN(date.getTime())) return '发布时间未知';
        return new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
        }).format(date);
      };

      const interpolateFans = (points, time) => {
        for (let i = 1; i < points.length; i += 1) {
          const leftTime = new Date(points[i - 1].time).getTime();
          const rightTime = new Date(points[i].time).getTime();
          if (time <= rightTime) {
            const ratio = rightTime === leftTime ? 0 : (time - leftTime) / (rightTime - leftTime);
            return points[i - 1].fans + (points[i].fans - points[i - 1].fans) * ratio;
          }
        }
        return points[points.length - 1].fans;
      };

      const createVideoDetail = video => {
        const detail = document.createElement('div');
        detail.className = 'video-detail';
        const cover = document.createElement('div');
        cover.className = 'video-detail-cover';
        const image = document.createElement('img');
        image.src = video.pic;
        image.alt = '';
        image.referrerPolicy = 'no-referrer';
        const duration = document.createElement('span');
        duration.className = 'video-duration';
        duration.textContent = formatVideoDuration(video.duration);
        cover.append(image, duration);
        const copy = document.createElement('div');
        copy.className = 'video-detail-copy';
        const title = document.createElement('div');
        title.className = 'video-detail-title';
        title.textContent = video.title || '未命名视频';
        const meta = document.createElement('div');
        meta.className = 'video-detail-meta';
        meta.textContent = formatVideoDate(video.pubdate);
        copy.append(title, meta);
        detail.append(cover, copy);
        return detail;
      };

      const renderVideoMarkers = (chartInstance, state) => {
        markerLayer.replaceChildren();
        if (!state.points.length) return;
        const wrapRect = markerLayer.parentElement.getBoundingClientRect();
        const canvasRect = chartInstance.canvas.getBoundingClientRect();
        const leftOffset = canvasRect.left - wrapRect.left;
        const topOffset = canvasRect.top - wrapRect.top;

        const orderedPoints = [...state.points].sort((a, b) => Number(a.video.pubdate) - Number(b.video.pubdate));
        for (const [index, point] of orderedPoints.entries()) {
          const marker = document.createElement('a');
          marker.className = state.showLabels ? 'video-marker-label' : 'video-marker-hit';
          marker.href = `https://www.bilibili.com/video/${encodeURIComponent(point.video.bvid)}`;
          marker.target = '_blank';
          marker.rel = 'noopener noreferrer';
          marker.setAttribute('aria-label', `视频投稿：${point.video.title || '未命名视频'}`);
          if (state.showLabels) {
            const title = document.createElement('span');
            title.className = 'video-marker-title';
            title.textContent = point.video.title || '未命名视频';
            marker.append(title);
          }
          marker.append(createVideoDetail(point.video));
          marker.style.left = `${leftOffset + point.x}px`;
          marker.style.top = `${topOffset + (state.showLabels ? state.labelY + (point.labelLane || 0) * 31 : point.y)}px`;
          marker.style.transform = 'translate(-50%, -50%)';
          marker.style.zIndex = String(index + 1);
          markerLayer.append(marker);
        }
      };

      const updateNavigator = () => {
        const activeRange = getActiveRange();
        if (overviewChart) {
          overviewChart.$activeRange = activeRange;
          overviewChart.update('none');
          const navigatorRect = navigatorHandle.parentElement.getBoundingClientRect();
          const canvasRect = overviewChart.canvas.getBoundingClientRect();
          const left = overviewChart.scales.x.getPixelForValue(activeRange.start);
          const right = overviewChart.scales.x.getPixelForValue(activeRange.end);
          const canvasLeft = canvasRect.left - navigatorRect.left;
          const canvasTop = canvasRect.top - navigatorRect.top;
          const windowTop = canvasTop + overviewChart.chartArea.top;
          navigatorHandle.style.left = `${canvasLeft + (left + right) / 2}px`;
          navigatorHandle.style.top = `${windowTop - 18}px`;
          navigatorFullDays.style.left = `${canvasLeft + (left + right) / 2}px`;
          navigatorFullDays.style.top = `${windowTop - 20}px`;
          windowStartDate.style.left = `${canvasLeft + (left + right) / 2}px`;
          windowStartDate.style.top = `${windowTop - 20}px`;
          windowEndDate.style.left = `${canvasLeft + (left + right) / 2}px`;
          windowEndDate.style.top = `${windowTop - 20}px`;
          windowStartDate.textContent = formatNavigatorDate(activeRange.start, false);
          windowEndDate.textContent = formatNavigatorDate(activeRange.end, false);
          const coversFullRange = activeRange.maxStart === fullStartTime;
          navigatorHandle.hidden = coversFullRange;
          navigatorFullDays.hidden = !coversFullRange;
          navigatorFullDays.textContent = `${fullDays}天`;
        }
      };

      const renderNavigator = () => {
        const navigatorStyle = getComputedStyle(document.documentElement);
        const navigatorAccent = navigatorStyle.getPropertyValue('--accent').trim();
        const navigatorAccentFill = navigatorStyle.getPropertyValue('--accent-fill').trim();
        const navigatorDim = navigatorStyle.getPropertyValue('--text-dim').trim();
        const rangeOverlayPlugin = {
          id: 'rangeOverlay',
          afterDatasetsDraw(instance) {
            const activeRange = instance.$activeRange;
            if (!activeRange) return;
            const { ctx, chartArea, scales } = instance;
            const left = scales.x.getPixelForValue(activeRange.start);
            const right = scales.x.getPixelForValue(activeRange.end);
            ctx.save();
            ctx.fillStyle = navigatorAccentFill;
            ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
            ctx.strokeStyle = navigatorAccent;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(left + .75, chartArea.top + .75, Math.max(0, right - left - 1.5), chartArea.bottom - chartArea.top - 1.5);
            ctx.restore();
          }
        };
        overviewChart = new Chart(document.getElementById('overviewChart').getContext('2d'), {
          type: 'line',
          data: {
            datasets: [{
              data: records.map(record => ({ x: new Date(record.time), y: record.fans })),
              borderColor: navigatorAccent,
              borderWidth: 1.5,
              pointRadius: 0,
              fill: true,
              backgroundColor: navigatorAccentFill,
              tension: 0.3
            }]
          },
          plugins: [rangeOverlayPlugin],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            events: [],
            scales: {
              x: { type: 'time', display: false },
              y: { display: false }
            },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            layout: { padding: { left: 1, right: 1, top: 3, bottom: 3 } },
            color: navigatorDim
          }
        });
        updateNavigator();
      };

      const renderChart = () => {
        selectedPoints = [];
        const activeRange = getActiveRange();
        const filtered = records.filter(record => {
          const time = new Date(record.time).getTime();
          return time >= activeRange.start && time <= activeRange.end;
        });
        const ctx = document.getElementById('chart').getContext('2d');
        if (chart) chart.destroy();

        const computedStyle = getComputedStyle(document.documentElement);
        const colorDim = computedStyle.getPropertyValue('--text-dim').trim();
        const colorBorder = computedStyle.getPropertyValue('--border').trim();
        const colorAccent = computedStyle.getPropertyValue('--accent').trim();
        const colorAccentFill = computedStyle.getPropertyValue('--accent-fill').trim();
        const pointStep = Math.max(1, Math.ceil(filtered.length / 60));

        const formatDuration = ms => {
          const abs = Math.abs(ms);
          const days = Math.floor(abs / 86400000);
          const hours = Math.floor((abs % 86400000) / 3600000);
          const minutes = Math.floor((abs % 3600000) / 60000);
          if (days > 0) return `${days}天${hours > 0 ? ` ${hours}小时` : ''}`;
          if (hours > 0) return `${hours}小时${minutes > 0 ? ` ${minutes}分钟` : ''}`;
          return `${minutes}分钟`;
        };

        const drawLabel = (ctx, text, x, y) => {
          const paddingX = 8;
          const paddingY = 5;
          ctx.save();
          ctx.font = '12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
          const width = ctx.measureText(text).width + paddingX * 2;
          const height = 24;
          const area = chart.chartArea;
          const left = Math.max(area.left + 4, Math.min(x - width / 2, area.right - width - 4));
          const top = Math.max(area.top + 4, Math.min(y - height / 2, area.bottom - height - 4));
          ctx.fillStyle = computedStyle.getPropertyValue('--card-bg').trim();
          ctx.strokeStyle = colorBorder;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(left, top, width, height, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = colorDim;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, left + width / 2, top + height / 2);
          ctx.restore();
        };

        const drawPoint = (ctx, x, y) => {
          ctx.save();
          ctx.fillStyle = computedStyle.getPropertyValue('--card-bg').trim();
          ctx.strokeStyle = colorAccent;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        };

        const comparisonPlugin = {
          id: 'comparisonOverlay',
          afterDatasetsDraw(chart) {
            if (selectedPoints.length === 0) return;
            const { ctx, chartArea, scales } = chart;
            const points = [...selectedPoints].sort((a, b) => new Date(a.time) - new Date(b.time));

            ctx.save();
            ctx.strokeStyle = colorAccent;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 4]);

            if (points.length === 1) {
              const p = points[0];
              const x = scales.x.getPixelForValue(new Date(p.time));
              const y = scales.y.getPixelForValue(p.fans);
              ctx.beginPath();
              ctx.moveTo(x, chartArea.top);
              ctx.lineTo(x, chartArea.bottom);
              ctx.moveTo(chartArea.left, y);
              ctx.lineTo(chartArea.right, y);
              ctx.stroke();
              ctx.restore();
              drawPoint(ctx, x, y);
              return;
            }

            const [a, b] = points;
            const x1 = scales.x.getPixelForValue(new Date(a.time));
            const y1 = scales.y.getPixelForValue(a.fans);
            const x2 = scales.x.getPixelForValue(new Date(b.time));
            const y2 = scales.y.getPixelForValue(b.fans);
            ctx.setLineDash([8, 5]);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();

            drawPoint(ctx, x1, y1);
            drawPoint(ctx, x2, y2);
            drawLabel(ctx, formatDuration(new Date(b.time) - new Date(a.time)), (x1 + x2) / 2, y1 - 18);
            const diffFans = b.fans - a.fans;
            drawLabel(ctx, `${diffFans >= 0 ? '+' : ''}${diffFans.toLocaleString()} 粉丝`, x2 + 48, (y1 + y2) / 2);
          }
        };

        const videoMarkerPlugin = {
          id: 'videoMarkers',
          afterDatasetsDraw(chartInstance) {
            if (filtered.length === 0) {
              chartInstance.$videoMarkerState = { points: [], showLabels: false };
              return;
            }
            const firstTime = activeRange.start;
            const lastTime = activeRange.end;
            const points = videos
              .filter(video => {
                const time = Number(video.pubdate) * 1000;
                return Number.isFinite(time) && time >= firstTime && time <= lastTime;
              })
              .map(video => {
                const time = Number(video.pubdate) * 1000;
                const fans = interpolateFans(records, time);
                return {
                  video,
                  x: chartInstance.scales.x.getPixelForValue(time),
                  y: chartInstance.scales.y.getPixelForValue(fans)
                };
              });
            if (showVideoPosts) {
              const lanes = [[], [], []];
              // A small overlap keeps the label area compact; only clearly
              // overlapping labels need a different track.
              const minimumLabelGap = 112;
              [...points]
                .sort((a, b) => a.x - b.x)
                .forEach(point => {
                  let laneIndex = lanes.findIndex(lane => lane.every(other => Math.abs(other.x - point.x) >= minimumLabelGap));
                  if (laneIndex === -1) {
                    // More than three labels overlap: reuse the lane whose
                    // closest label is furthest away.
                    laneIndex = lanes
                      .map((lane, index) => ({
                        index,
                        clearance: Math.min(...lane.map(other => Math.abs(other.x - point.x)))
                      }))
                      .sort((a, b) => b.clearance - a.clearance)[0].index;
                  }
                  point.labelLane = laneIndex;
                  lanes[laneIndex].push(point);
                });
            }
            const state = {
              points,
              showLabels: showVideoPosts,
              labelY: chartInstance.chartArea.top - 77
            };
            chartInstance.$videoMarkerState = state;

            const { ctx } = chartInstance;
            ctx.save();
            ctx.strokeStyle = colorAccent;
            ctx.fillStyle = colorAccent;
            ctx.lineWidth = 1.5;
            for (const point of points) {
              const labelY = state.labelY + (point.labelLane || 0) * 31;
              if (state.showLabels && point.y > labelY + 16) {
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(point.x, labelY + 16);
                ctx.lineTo(point.x, point.y - 10);
                ctx.stroke();
              }
              ctx.setLineDash([]);
              // A small flag makes a publishing event visually distinct from
              // the blue circular markers used for fan samples.
              ctx.beginPath();
              ctx.moveTo(point.x, point.y - 9);
              ctx.lineTo(point.x, point.y + 8);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(point.x, point.y - 9);
              ctx.lineTo(point.x + 8, point.y - 5);
              ctx.lineTo(point.x, point.y - 1);
              ctx.closePath();
              ctx.fill();
            }
            ctx.restore();
          },
          afterRender(chartInstance) {
            renderVideoMarkers(chartInstance, chartInstance.$videoMarkerState || { points: [], showLabels: false });
          }
        };

        chart = new Chart(ctx, {
          type: 'line',
          data: { datasets: [{ data: filtered.map(r => ({x: new Date(r.time), y: r.fans})), borderColor: colorAccent, fill: true, backgroundColor: colorAccentFill, tension: 0.3, pointRadius: ctx => ctx.dataIndex % pointStep === 0 ? 3 : 0, pointHoverRadius: 5, pointHitRadius: 10 }] },
          plugins: [comparisonPlugin, videoMarkerPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            layout: { padding: { top: showVideoPosts ? 92 : 0 } },
            onClick: (event) => {
              const elements = chart.getElementsAtEventForMode(event, 'nearest', { intersect: true }, true);
              if (elements.length === 0) {
                selectedPoints = [];
                chart.update();
                return;
              }
              const point = filtered[elements[0].index];
              selectedPoints = selectedPoints.length >= 2 ? [point] : [...selectedPoints, point];
              chart.update();
            },
            scales: { 
              x: { 
                type: 'time', 
                min: activeRange.start,
                max: activeRange.end,
                time: {
                  minUnit: 'hour',
                  tooltipFormat: 'yyyy-MM-dd HH:mm',
                  displayFormats: {
                    millisecond: 'HH:mm:ss.SSS',
                    second: 'HH:mm:ss',
                    minute: 'HH:mm',
                    hour: 'HH:mm',
                    day: 'MM-dd',
                    week: 'MM-dd',
                    month: 'yyyy-MM',
                    quarter: 'yyyy QQQ',
                    year: 'yyyy'
                  }
                },
                ticks: { color: colorDim }, 
                grid: { color: colorBorder },
                border: { color: colorBorder }
              }, 
              y: { 
                ticks: { color: colorDim, callback: v => v.toLocaleString() }, 
                grid: { color: colorBorder },
                border: { color: colorBorder }
              } 
            },
            plugins: { legend: { display: false } }
          }
        });
        updateNavigator();
      };
      
      rangeButtons.forEach(btn => btn.onclick = function() {
        setSelectedDays(Number(this.dataset.days));
        syncRangeControl();
        savePreferences();
        renderChart();
      });

      const applyCustomDays = () => {
        const days = Number(customDaysInput.value);
        if (!Number.isFinite(days) || days <= 0) return;
        setSelectedDays(Math.floor(days));
        syncRangeControl();
        savePreferences();
        renderChart();
      };
      customDaysInput.oninput = applyCustomDays;

      let navigatorDrag = null;
      navigatorHandle.addEventListener('pointerdown', event => {
        if (!overviewChart) return;
        const canvasRect = overviewChart.canvas.getBoundingClientRect();
        navigatorDrag = {
          pointerId: event.pointerId,
          startValue: overviewChart.scales.x.getValueForPixel(event.clientX - canvasRect.left),
          rangeStart
        };
        navigatorHandle.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      navigatorHandle.addEventListener('pointermove', event => {
        if (!navigatorDrag || event.pointerId !== navigatorDrag.pointerId || !overviewChart) return;
        const canvasRect = overviewChart.canvas.getBoundingClientRect();
        const currentValue = overviewChart.scales.x.getValueForPixel(event.clientX - canvasRect.left);
        rangeStart = navigatorDrag.rangeStart + currentValue - navigatorDrag.startValue;
        renderChart();
      });
      const endNavigatorDrag = event => {
        if (!navigatorDrag || event.pointerId !== navigatorDrag.pointerId) return;
        navigatorHandle.releasePointerCapture(event.pointerId);
        navigatorDrag = null;
      };
      navigatorHandle.addEventListener('pointerup', endNavigatorDrag);
      navigatorHandle.addEventListener('pointercancel', endNavigatorDrag);
      document.getElementById('videoToggle').onchange = function() {
        showVideoPosts = this.checked;
        savePreferences();
        renderChart();
      };
      renderNavigator();
      renderChart();
    }
  </script>
</body>
</html>
